name: Verify Site

on:
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        run: python3 scripts/verify_site.py

      - name: Test documentation publication selection
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Test board AI moderation
        run: node --test scripts/tests/test_board_review.mjs

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Validate workflow wiring
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=''
