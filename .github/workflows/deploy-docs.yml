name: Deploy Docs

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: documentation-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select current main with successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/docs_release.py
      - name: Checkout verified documentation source
        if: steps.source.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: windoze95/cantinarr
          ref: ${{ steps.source.outputs.sha }}
          path: cantinarr
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cantinarr/docs-site/package-lock.json
      - name: Build and validate locked source
        if: steps.source.outputs.ready == 'true'
        working-directory: cantinarr/docs-site
        run: |
          npm ci
          npm run build
      - name: Recheck current main before publishing
        if: steps.source.outputs.ready == 'true'
        id: recheck
        env:
          SELECTED_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/docs_release.py --expected-sha "$SELECTED_SHA"
      - name: Publish documentation
        if: steps.recheck.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.75.0'
          workingDirectory: cantinarr/docs-site
          command: pages deploy dist --project-name=cantinarr-docs --branch=main --commit-hash=${{ steps.source.outputs.sha }} --commit-dirty=false
      - name: Check the published domain
        if: steps.recheck.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors https://docs.cantinarr.com/ -o /tmp/docs-home.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors https://docs.cantinarr.com/start/quickstart/ -o /tmp/docs-guide.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors https://docs.cantinarr.com/pagefind/pagefind-entry.json -o /tmp/docs-search.json
