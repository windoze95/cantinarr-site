<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board moderation · Cantinarr</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0805">
<link rel="icon" href="/static/favicon.png?v=4" type="image/png">
<link rel="stylesheet" href="/site.css?v=mobile-nav-1">
<style>
.mod-wrap { max-width: 1640px; margin: 0 auto; padding: 40px 24px 70px; }
.mod-wrap h1 { font-family: var(--display); font-weight: 620; font-size: 2rem; margin-bottom: 8px; }
.mod-wrap .sub { color: var(--muted); margin-bottom: 28px; }
.unlock { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
.unlock input {
  flex: 1;
  min-width: 220px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: .95rem;
  padding: 11px 13px;
}
.unlock .btn { border: 0; cursor: pointer; font-family: var(--body); }
#mod-status { color: var(--muted); margin-bottom: 18px; }
#mod-status:empty { display: none; }
.mod-item { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
.mod-item { min-width: 0; }
.mod-item h3 { font-family: var(--body); font-weight: 600; font-size: 1rem; line-height: 1.4; overflow-wrap: anywhere; }
.mod-item .meta { font-size: .78rem; color: var(--gold); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
.mod-item .meta.pending { color: var(--signal); }
.mod-item .detail { color: var(--muted); font-size: .88rem; margin-top: 8px; white-space: pre-line; overflow-wrap: anywhere; }
.manage-panel { margin-top: 12px; border-top: 1px solid var(--border); }
.manage-panel > summary { cursor: pointer; color: var(--gold); min-height: 44px; padding-block: 12px; font-size: .88rem; }
.mod-votes { font-variant-numeric: tabular-nums; }
.private-contact { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: .88rem; overflow-wrap: anywhere; }
.private-contact strong { color: var(--gold); }
.private-contact p { margin-top: 6px; }
.mod-item .review { color: var(--ink); font-size: .88rem; margin-top: 10px; white-space: pre-line; overflow-wrap: anywhere; }
.mod-item .review strong { color: var(--gold); }
.mod-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.mod-actions button {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--ink);
  font-size: .85rem;
  padding: 10px 12px;
  min-height: 44px;
  cursor: pointer;
}
.mod-actions button:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--border)); }
.mod-actions button.danger { color: var(--signal); }
.response-editor { margin-top: 20px; border-left: 3px solid var(--gold); padding-left: 15px; }
.issue-editor { margin-top: 20px; }
.issue-editor label, .response-editor label, .comment-form label { display: block; font-weight: 600; margin-bottom: 7px; }
.issue-editor .hint, .response-editor .hint, .comment-form .hint { color: var(--muted); font-size: .85rem; margin: 0 0 9px; }
.issue-editor input { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px 12px; background: var(--bg-2); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 16px; }
.issue-editor .mod-actions { align-items: center; }
.issue-open { font-size: .85rem; padding: 7px 0; }
.mod-item textarea { display: block; box-sizing: border-box; width: 100%; max-width: 100%; min-height: 100px; resize: vertical; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--ink); font: inherit; font-size: 16px; }
.mod-item textarea:focus-visible, .mod-item button:focus-visible, .mod-comments summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.mod-item button:disabled { opacity: .55; cursor: wait; }
.thread-status { color: var(--muted); font-size: .85rem; margin-top: 9px; overflow-wrap: anywhere; }
.thread-status:empty { display: none; }
.mod-comments { margin-top: 20px; border-top: 1px solid var(--border); }
.mod-comments summary { cursor: pointer; color: var(--gold); padding: 13px 0; min-height: 44px; }
.comment-list { list-style: none; padding: 0; }
.comment-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.comment-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--muted); }
.comment-meta strong { color: var(--gold); }
.comment-pending { color: var(--signal); }
.comment-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .92rem; margin-top: 7px; }
.comment-form { margin-top: 18px; }
@media (max-width: 600px) {
  .mod-wrap { padding: 24px 16px 50px; }
  .unlock input { min-width: 0; width: 100%; }
}
</style>
<link rel="stylesheet" href="/static/board-workspace-v1.css">
</head>
<body class="roadmap-admin">
<main class="mod-wrap">
  <h1>Board moderation</h1>
  <p class="sub">Review ideas and comments, link issues, and post updates. <a href="/roadmap/">View public roadmap</a>.</p>
  <div class="unlock">
    <input id="token" type="password" placeholder="Admin token" aria-label="Admin token" autocomplete="current-password">
    <button id="load" class="btn btn-gold" type="button">Load board</button>
  </div>
  <p id="mod-status" role="status"></p>
  <div id="mod-controls" hidden></div>
  <div id="mod-sections" class="mod-sections"></div>
</main>

<script src="/static/board-view-v2.js"></script>
<script>
(function () {
  'use strict';

  var tokenInput = document.getElementById('token');
  var status = document.getElementById('mod-status');
  var sections = document.getElementById('mod-sections');
  var reviewEnabled = false;
  var communicationDrafts = {};
  var activeCommunicationRequests = 0;
  var reloadAfterCommunication = false;
  var boardLoadVersion = 0;
  var boardView = window.RoadmapBoard.create({
    root: sections,
    controls: document.getElementById('mod-controls'),
    admin: true,
    statuses: [
      { value: 'pending', label: 'Pending review' },
      { value: 'open', label: 'Open' },
      { value: 'planned', label: 'Planned' },
      { value: 'shipped', label: 'Shipped' },
      { value: 'declined', label: 'Declined' }
    ],
    renderItem: renderItem
  });
  tokenInput.value = sessionStorage.getItem('cb_admin') || '';

  function clearPrivateBoard() {
    boardLoadVersion += 1;
    boardView.clear();
    communicationDrafts = {};
    reloadAfterCommunication = false;
    sessionStorage.removeItem('cb_admin');
  }

  function api(path, options) {
    options = options || {};
    var requestToken = tokenInput.value.trim();
    var requestBoardVersion = boardLoadVersion;
    options.headers = Object.assign({
      authorization: 'Bearer ' + requestToken,
      'content-type': 'application/json'
    }, options.headers || {});
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) {
          var error = new Error(body.error || ('http_' + res.status));
          error.confirmed = true;
          error.boardVersion = requestBoardVersion;
          if (res.status === 401 && requestBoardVersion === boardLoadVersion &&
              requestToken === tokenInput.value.trim()) {
            clearPrivateBoard();
            error.boardVersion = boardLoadVersion;
          }
          throw error;
        }
        return body;
      });
    });
  }

  function act(id, action) {
    return api('/api/board/admin', { method: 'POST', body: JSON.stringify({ id: id, action: action }) })
      .then(load)
      .catch(function (err) { status.textContent = 'Action failed: ' + err.message; });
  }

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function actionButton(label, id, action, danger) {
    var btn = make('button', danger ? 'danger' : null, label);
    btn.type = 'button';
    if (danger) {
      btn.addEventListener('click', function () {
        if (btn.dataset.armed === '1') { act(id, action); return; }
        btn.dataset.armed = '1';
        btn.textContent = 'Confirm ' + label.toLowerCase();
        setTimeout(function () { btn.dataset.armed = ''; btn.textContent = label; }, 4000);
      });
    } else {
      btn.addEventListener('click', function () { act(id, action); });
    }
    return btn;
  }

  function postAction(payload) {
    return api('/api/board/admin', { method: 'POST', body: JSON.stringify(payload) })
      .then(function (result) {
        if (result.ok !== true) throw new Error('unconfirmed_reply');
        return result;
      });
  }

  function threadStatus() {
    var message = make('p', 'thread-status');
    message.setAttribute('role', 'status');
    return message;
  }

  function fieldLabel(text, id) {
    var label = make('label', null, text);
    label.setAttribute('for', id);
    return label;
  }

  function captureCommunicationDrafts() {
    Object.keys(communicationDrafts).forEach(function (id) {
      var draft = communicationDrafts[id];
      if (!draft.view) return;
      if (draft.view.response.value === draft.view.savedResponse) delete draft.response;
      else draft.response = draft.view.response.value;
      if (draft.view.issue.value === draft.view.savedIssue) delete draft.issue;
      else draft.issue = draft.view.issue.value;
      draft.comment = draft.view.comment.value;
      draft.open = draft.view.comments.open;
      draft.manageOpen = draft.view.manage.open;
    });
  }

  function finishCommunicationRequest() {
    activeCommunicationRequests -= 1;
    if (!activeCommunicationRequests && reloadAfterCommunication) {
      reloadAfterCommunication = false;
      load();
    }
  }

  function addCommunication(item, f, updateCard) {
    var draft = communicationDrafts[f.id] || (communicationDrafts[f.id] = {});
    var issueForm = make('form', 'issue-editor');
    var issueId = 'issue-' + f.id;
    issueForm.appendChild(fieldLabel('GitHub issue (optional)', issueId));
    var issueHint = make('p', 'hint', 'Link the issue tracking this request.');
    issueHint.id = 'issue-hint-' + f.id;
    issueForm.appendChild(issueHint);
    var issueInput = make('input');
    issueInput.id = issueId;
    issueInput.type = 'url';
    issueInput.maxLength = 1000;
    issueInput.placeholder = 'https://github.com/owner/repo/issues/123';
    issueInput.setAttribute('aria-describedby', issueHint.id);
    issueInput.value = draft.issue !== undefined ? draft.issue : (f.githubIssueUrl || '');
    issueForm.appendChild(issueInput);
    var issueActions = make('div', 'mod-actions');
    var saveIssue = make('button', null, 'Save issue');
    saveIssue.type = 'submit';
    var removeIssue = make('button', 'danger', 'Remove issue');
    removeIssue.type = 'button';
    var openIssue = make('a', 'issue-open', 'Open issue');
    openIssue.target = '_blank';
    openIssue.rel = 'noopener noreferrer';
    openIssue.setAttribute('aria-label', 'Open linked GitHub issue in a new tab');
    issueActions.appendChild(saveIssue);
    issueActions.appendChild(removeIssue);
    issueActions.appendChild(openIssue);
    issueForm.appendChild(issueActions);
    var issueStatus = threadStatus();
    issueForm.appendChild(issueStatus);
    item.appendChild(issueForm);
    var savingIssue = false;
    function updateIssueLink() {
      removeIssue.hidden = !f.githubIssueUrl;
      openIssue.hidden = !f.githubIssueUrl;
      openIssue.href = f.githubIssueUrl || '';
    }
    updateIssueLink();
    function saveIssueLink(value) {
      if (savingIssue) return;
      savingIssue = true;
      activeCommunicationRequests += 1;
      issueInput.disabled = saveIssue.disabled = removeIssue.disabled = true;
      issueStatus.textContent = 'Saving…';
      postAction({ id: f.id, action: 'link_issue', url: value }).then(function (result) {
        if (typeof result.githubIssueUrl !== 'string') throw new Error('unconfirmed_reply');
        f.githubIssueUrl = result.githubIssueUrl;
        issueInput.value = f.githubIssueUrl;
        draft.view.savedIssue = f.githubIssueUrl;
        delete draft.issue;
        updateIssueLink();
        updateCard();
        issueStatus.textContent = f.githubIssueUrl ? 'GitHub issue linked.' : 'GitHub issue removed.';
      }).catch(function (err) {
        issueStatus.textContent = err.message === 'invalid_issue_url'
          ? 'Enter a GitHub issue URL, such as https://github.com/owner/repo/issues/123.'
          : 'Could not confirm the save. Your draft is still here. Load the board to check the saved link.';
      }).finally(function () {
        savingIssue = false;
        issueInput.disabled = saveIssue.disabled = removeIssue.disabled = false;
        finishCommunicationRequest();
      });
    }
    issueForm.addEventListener('submit', function (event) {
      event.preventDefault();
      saveIssueLink(issueInput.value);
    });
    removeIssue.addEventListener('click', function () { saveIssueLink(''); });
    var responseForm = make('form', 'response-editor');
    var responseId = 'response-' + f.id;
    responseForm.appendChild(fieldLabel('Maintainer response', responseId));
    responseForm.appendChild(make('p', 'hint', 'Pinned on the public card, above the comments.'));
    var responseInput = make('textarea');
    responseInput.id = responseId;
    responseInput.maxLength = 2000;
    responseInput.rows = 3;
    responseInput.value = draft.response !== undefined ? draft.response : (f.maintainerResponse || '');
    responseForm.appendChild(responseInput);
    var responseActions = make('div', 'mod-actions');
    var saveResponse = make('button', null, 'Save response');
    saveResponse.type = 'submit';
    var clearResponse = make('button', 'danger', 'Remove response');
    clearResponse.type = 'button';
    clearResponse.hidden = !f.maintainerResponse;
    responseActions.appendChild(saveResponse);
    responseActions.appendChild(clearResponse);
    responseForm.appendChild(responseActions);
    var responseStatus = threadStatus();
    responseForm.appendChild(responseStatus);
    item.appendChild(responseForm);
    var savingResponse = false;

    function savePinned(value) {
      if (savingResponse) return;
      savingResponse = true;
      activeCommunicationRequests += 1;
      responseInput.disabled = saveResponse.disabled = clearResponse.disabled = true;
      responseStatus.textContent = 'Saving…';
      postAction({ id: f.id, action: 'respond', body: value }).then(function () {
        f.maintainerResponse = value.trim();
        responseInput.value = f.maintainerResponse;
        draft.view.savedResponse = f.maintainerResponse;
        delete draft.response;
        clearResponse.hidden = !f.maintainerResponse;
        updateCard();
        responseStatus.textContent = f.maintainerResponse ? 'Response saved on the card.' : 'Response removed.';
      }).catch(function (err) {
        responseStatus.textContent = err.confirmed
          ? 'Could not save the response: ' + err.message + '. Your draft is still here.'
          : 'Could not confirm the save. Reload the board to check the saved response. Your draft is still here.';
      }).finally(function () {
        savingResponse = false;
        responseInput.disabled = saveResponse.disabled = clearResponse.disabled = false;
        finishCommunicationRequest();
      });
    }
    responseForm.addEventListener('submit', function (event) {
      event.preventDefault();
      savePinned(responseInput.value);
    });
    clearResponse.addEventListener('click', function () { savePinned(''); });

    var comments = make('details', 'mod-comments');
    comments.open = Boolean(draft.open);
    var summary = make('summary');
    comments.appendChild(summary);
    function updateSummary() {
      summary.textContent = 'Comments (' + (f.commentCount || 0) + ' published' +
        (f.pendingCommentCount ? ', ' + f.pendingCommentCount + ' pending' : '') + ')';
    }
    updateSummary();
    var list = make('ul', 'comment-list');
    comments.appendChild(list);
    var commentStatus = threadStatus();
    comments.appendChild(commentStatus);
    var readActions = make('div', 'mod-actions');
    var more = make('button', null, 'Load more comments');
    more.type = 'button';
    more.hidden = true;
    var refresh = make('button', null, 'Refresh comments');
    refresh.type = 'button';
    readActions.appendChild(more);
    readActions.appendChild(refresh);
    comments.appendChild(readActions);
    var commentForm = make('form', 'comment-form');
    var commentId = 'comment-' + f.id;
    commentForm.appendChild(fieldLabel('Comment as maintainer', commentId));
    commentForm.appendChild(make('p', 'hint', 'Published in the conversation. Use the response above for a pinned update.'));
    var commentInput = make('textarea');
    commentInput.id = commentId;
    commentInput.maxLength = 2000;
    commentInput.rows = 3;
    commentInput.required = true;
    commentInput.value = draft.comment || '';
    commentForm.appendChild(commentInput);
    var postActions = make('div', 'mod-actions');
    var post = make('button', null, 'Post comment');
    post.type = 'submit';
    postActions.appendChild(post);
    commentForm.appendChild(postActions);
    var postStatus = threadStatus();
    commentForm.appendChild(postStatus);
    comments.appendChild(commentForm);
    item.appendChild(comments);
    var loaded = false;
    var loading = false;
    var posting = false;
    var uncertainPost = Boolean(draft.uncertainPost);
    post.disabled = uncertainPost;
    if (uncertainPost) postStatus.textContent = 'Could not confirm the post. Refresh comments and check for your comment before posting again. Your draft is still here.';
    draft.view = { response: responseInput, savedResponse: f.maintainerResponse || '',
      issue: issueInput, savedIssue: f.githubIssueUrl || '', comment: commentInput, comments: comments,
      manage: item };
    var cursor = null;
    var renderedIds = {};

    function commentAction(button, comment, action, row, meta) {
      if (button.disabled) return;
      button.disabled = true;
      activeCommunicationRequests += 1;
      postAction({ id: f.id, action: action, commentId: comment.id }).then(function () {
        if (action === 'approve_comment') {
          comment.status = 'approved';
          f.pendingCommentCount = Math.max(0, (f.pendingCommentCount || 0) - 1);
          f.commentCount = (f.commentCount || 0) + 1;
          meta.textContent = 'Published';
          meta.className = '';
          button.hidden = true;
          commentStatus.textContent = 'Comment approved.';
        } else {
          if (Array.prototype.indexOf.call(list.children, row) !== -1) list.removeChild(row);
          if (comment.status === 'pending') f.pendingCommentCount = Math.max(0, (f.pendingCommentCount || 0) - 1);
          else f.commentCount = Math.max(0, (f.commentCount || 0) - 1);
          commentStatus.textContent = 'Comment deleted.';
        }
        updateSummary();
        updateCard();
      }).catch(function (err) {
        commentStatus.textContent = 'Could not confirm the change. Refresh comments to check before trying again.';
      }).finally(function () { button.disabled = false; finishCommunicationRequest(); });
    }

    function renderComment(comment) {
      if (renderedIds[comment.id]) return;
      renderedIds[comment.id] = true;
      var row = make('li', 'comment-item');
      var meta = make('div', 'comment-meta');
      meta.appendChild(make('strong', null, comment.author === 'maintainer' ? 'Maintainer' : 'Visitor'));
      var time = make('time', null, new Date(comment.createdAt).toLocaleString());
      time.setAttribute('datetime', comment.createdAt);
      meta.appendChild(time);
      var state = make('span', comment.status === 'pending' ? 'comment-pending' : '',
        comment.status === 'pending' ? 'Pending review' : 'Published');
      meta.appendChild(state);
      row.appendChild(meta);
      row.appendChild(make('p', 'comment-body', comment.body));
      var actions = make('div', 'mod-actions');
      if (comment.status === 'pending') {
        var approve = make('button', null, 'Approve comment');
        approve.type = 'button';
        approve.addEventListener('click', function () { commentAction(approve, comment, 'approve_comment', row, state); });
        actions.appendChild(approve);
      }
      var remove = make('button', 'danger', 'Delete comment');
      remove.type = 'button';
      remove.addEventListener('click', function () {
        if (remove.dataset.armed === '1') {
          commentAction(remove, comment, 'delete_comment', row, state);
          return;
        }
        remove.dataset.armed = '1';
        remove.textContent = 'Confirm delete comment';
        setTimeout(function () { remove.dataset.armed = ''; remove.textContent = 'Delete comment'; }, 4000);
      });
      actions.appendChild(remove);
      row.appendChild(actions);
      list.appendChild(row);
    }

    function readComments(append, manual) {
      if (loading) return;
      loading = true;
      post.disabled = true;
      more.disabled = refresh.disabled = true;
      commentStatus.textContent = 'Loading comments…';
      return api('/api/board/comments?id=' + f.id + (append && cursor ? '&after=' + cursor : ''), { cache: 'no-store' })
        .then(function (data) {
          if (!Array.isArray(data.comments)) throw new Error('invalid_comments');
          if (!append) { list.textContent = ''; renderedIds = {}; }
          data.comments.forEach(renderComment);
          cursor = data.nextCursor;
          more.hidden = cursor === null || cursor === undefined;
          loaded = true;
          commentStatus.textContent = list.children.length ? '' : 'No comments yet.';
          if (manual && uncertainPost) {
            uncertainPost = false;
            draft.uncertainPost = false;
            post.disabled = posting;
            postStatus.textContent = 'Comments refreshed. Check for your comment on all pages before posting again.';
          }
        }).catch(function () {
          commentStatus.textContent = 'Could not load comments. Refresh comments to try again.';
        }).finally(function () {
          loading = false;
          more.disabled = refresh.disabled = false;
          post.disabled = posting || uncertainPost;
        });
    }
    comments.addEventListener('toggle', function () {
      if (comments.open && !loaded) readComments(false, false);
    });
    more.addEventListener('click', function () { if (!posting) readComments(true, false); });
    refresh.addEventListener('click', function () { if (!posting) readComments(false, true); });
    commentForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (posting || uncertainPost || loading) return;
      var body = commentInput.value.trim();
      if (!body) { postStatus.textContent = 'Write a comment first.'; return; }
      posting = true;
      activeCommunicationRequests += 1;
      commentInput.disabled = post.disabled = more.disabled = refresh.disabled = true;
      postStatus.textContent = 'Posting…';
      postAction({ id: f.id, action: 'comment', body: body }).then(function () {
        commentInput.value = '';
        draft.comment = '';
        f.commentCount = (f.commentCount || 0) + 1;
        updateSummary();
        updateCard();
        postStatus.textContent = 'Comment published as maintainer.';
        return readComments(false, false);
      }).catch(function (err) {
        if (err.confirmed) postStatus.textContent = 'Could not post the comment: ' + err.message + '. Your draft is still here.';
        else {
          uncertainPost = true;
          draft.uncertainPost = true;
          postStatus.textContent = 'Could not confirm the post. Refresh comments and check for your comment before posting again. Your draft is still here.';
        }
      }).finally(function () {
        posting = false;
        commentInput.disabled = false;
        more.disabled = refresh.disabled = loading;
        post.disabled = uncertainPost;
        finishCommunicationRequest();
      });
    });
    if (comments.open) readComments(false, false);
  }

  function renderItem(f) {
    var draft = communicationDrafts[f.id] || (communicationDrafts[f.id] = {});
    var item = make('li', 'mod-item');
    var head = make('div', 'item-head');
    var title = make('h3', 'item-title item-preview' + (draft.detailsExpanded ? ' expanded' : ''), f.title);
    title.id = 'request-title-' + f.id;
    head.appendChild(title);
    var meta = make('div', 'meta' + (f.status === 'pending' ? ' pending' : ''));
    meta.appendChild(make('span', 'request-status', {
      pending: 'Pending review', open: 'Open', planned: 'Planned', shipped: 'Shipped', declined: 'Declined'
    }[f.status] || f.status));
    meta.appendChild(make('span', 'mod-votes', f.upvotes + ' up / ' + f.downvotes + ' down'));
    head.appendChild(meta);
    item.appendChild(head);
    var detail = make('p', 'detail item-preview' + (draft.detailsExpanded ? ' expanded' : ''), f.detail || '');
    detail.id = 'request-detail-' + f.id;
    if (f.detail) item.appendChild(detail);
    {
      var expand = make('button', 'item-expand', draft.detailsExpanded ? 'Show less' : 'Show details');
      expand.type = 'button';
      expand.setAttribute('aria-expanded', draft.detailsExpanded ? 'true' : 'false');
      expand.setAttribute('aria-controls', title.id + (f.detail ? ' ' + detail.id : ''));
      expand.setAttribute('aria-label', 'Show details for “' + f.title + '”');
      expand.addEventListener('click', function () {
        draft.detailsExpanded = !draft.detailsExpanded;
        title.className = 'item-title item-preview' + (draft.detailsExpanded ? ' expanded' : '');
        detail.className = 'detail item-preview' + (draft.detailsExpanded ? ' expanded' : '');
        expand.textContent = draft.detailsExpanded ? 'Show less' : 'Show details';
        expand.setAttribute('aria-expanded', draft.detailsExpanded ? 'true' : 'false');
        expand.setAttribute('aria-label', (draft.detailsExpanded ? 'Hide details for “' : 'Show details for “') + f.title + '”');
      });
      item.appendChild(expand);
    }
    var metadata = make('div', 'board-metadata');
    item.appendChild(metadata);
    var response = make('section', 'maintainer-response');
    response.setAttribute('aria-label', 'Maintainer response');
    response.appendChild(make('strong', 'response-label', 'Maintainer response'));
    var responseText = make('p', 'item-preview' + (draft.responseExpanded ? ' expanded' : ''));
    responseText.id = 'response-preview-' + f.id;
    response.appendChild(responseText);
    var expandResponse = make('button', 'item-expand', draft.responseExpanded ? 'Show less response' : 'Read full response');
    expandResponse.type = 'button';
    expandResponse.setAttribute('aria-controls', responseText.id);
    expandResponse.setAttribute('aria-expanded', draft.responseExpanded ? 'true' : 'false');
    expandResponse.addEventListener('click', function () {
      draft.responseExpanded = !draft.responseExpanded;
      responseText.className = 'item-preview' + (draft.responseExpanded ? ' expanded' : '');
      expandResponse.textContent = draft.responseExpanded ? 'Show less response' : 'Read full response';
      expandResponse.setAttribute('aria-expanded', draft.responseExpanded ? 'true' : 'false');
    });
    response.appendChild(expandResponse);
    item.appendChild(response);

    function updateCard(refresh) {
      metadata.textContent = '';
      var issue = typeof f.githubIssueUrl === 'string' && f.githubIssueUrl.match(
        /^https:\/\/github\.com\/([a-z0-9][a-z0-9-]*)\/([a-z0-9_.-]+)\/issues\/([1-9]\d*)$/i);
      if (issue) {
        var issueLink = make('a', 'metadata-chip', 'Issue #' + issue[3]);
        issueLink.href = f.githubIssueUrl;
        issueLink.target = '_blank';
        issueLink.rel = 'noopener noreferrer';
        issueLink.setAttribute('aria-label', 'Open ' + issue[1] + '/' + issue[2] + '#' + issue[3] + ' on GitHub in a new tab');
        metadata.appendChild(issueLink);
      } else metadata.appendChild(make('span', 'metadata-chip missing', 'No issue'));
      metadata.appendChild(make('span', 'metadata-chip' + (f.maintainerResponse ? '' : ' missing'),
        f.maintainerResponse ? 'Has response' : 'No response'));
      metadata.appendChild(make('span', 'metadata-chip', (f.commentCount || 0) + ((f.commentCount || 0) === 1 ? ' comment' : ' comments')));
      if (f.pendingCommentCount) metadata.appendChild(make('span', 'metadata-chip pending',
        f.pendingCommentCount + (f.pendingCommentCount === 1 ? ' pending comment' : ' pending comments')));
      metadata.appendChild(make('span', 'metadata-chip' + (f.contactEmail || f.contactDiscord ? '' : ' missing'),
        f.contactEmail || f.contactDiscord ? 'Contact provided' : 'No contact'));
      response.hidden = !f.maintainerResponse;
      responseText.textContent = f.maintainerResponse || '';
      if (refresh !== false) boardView.refresh();
    }
    updateCard(false);

    var manage = make('details', 'manage-panel');
    manage.open = Boolean(draft.manageOpen);
    var manageSummary = make('summary', null, 'Manage request');
    manageSummary.setAttribute('aria-label', 'Manage “' + f.title + '”');
    manage.appendChild(manageSummary);
    if (f.contactEmail || f.contactDiscord) {
      var contact = make('div', 'private-contact');
      contact.appendChild(make('strong', null, 'Contact · Admin only'));
      if (f.contactEmail) contact.appendChild(make('p', 'contact-email', 'Email: ' + f.contactEmail));
      if (f.contactDiscord) contact.appendChild(make('p', 'contact-discord', 'Discord: ' + f.contactDiscord));
      manage.appendChild(contact);
    }
    var recommendation = f.review ? {
      approve: 'Approved', decline: 'Declined',
      human: f.status === 'pending' ? 'Needs your review' : 'Suggested human review'
    }[f.review.recommendation] : null;
    if (f.status === 'pending' || f.review) {
      var review = make('p', 'review');
      review.appendChild(make('strong', null, recommendation ? 'Luna: ' + recommendation :
        (!reviewEnabled ? 'Luna review is not configured' :
          (f.reviewState === 'waiting' ? 'Luna review will retry' : 'Awaiting Luna review'))));
      if (f.review) review.appendChild(document.createTextNode(' · ' + f.review.reason));
      manage.appendChild(review);
    }
    var actions = make('div', 'mod-actions');
    actions.setAttribute('role', 'group');
    actions.setAttribute('aria-label', 'Change request status');
    if (f.status === 'pending') actions.appendChild(actionButton('Approve', f.id, 'approve'));
    if (f.status !== 'open' && f.status !== 'pending') actions.appendChild(actionButton('Reopen', f.id, 'open'));
    if (f.status !== 'planned') actions.appendChild(actionButton('Planned', f.id, 'planned'));
    if (f.status !== 'shipped') actions.appendChild(actionButton('Shipped', f.id, 'shipped'));
    if (f.status !== 'declined') actions.appendChild(actionButton('Decline', f.id, 'decline', true));
    actions.appendChild(actionButton('Delete', f.id, 'delete', true));
    manage.appendChild(actions);
    addCommunication(manage, f, updateCard);
    item.appendChild(manage);
    return item;
  }

  function render(features, enabled) {
    if (activeCommunicationRequests) {
      reloadAfterCommunication = true;
      status.textContent = 'A change is still saving. The board will refresh when it finishes.';
      return;
    }
    captureCommunicationDrafts();
    Object.keys(communicationDrafts).forEach(function (id) {
      if (!features.some(function (feature) { return String(feature.id) === id; })) delete communicationDrafts[id];
    });
    reviewEnabled = enabled;
    boardView.setItems(features);
    status.textContent = features.length === 0 ? 'Nothing on the board yet.' : '';
  }

  function load() {
    if (!tokenInput.value.trim()) {
      clearPrivateBoard();
      status.textContent = 'Enter the admin token first.';
      return;
    }
    if (activeCommunicationRequests) {
      reloadAfterCommunication = true;
      status.textContent = 'A change is still saving. The board will refresh when it finishes.';
      return;
    }
    var requestedToken = tokenInput.value.trim();
    var loadVersion = ++boardLoadVersion;
    sessionStorage.setItem('cb_admin', requestedToken);
    status.textContent = 'Loading…';
    api('/api/board/admin').then(function (data) {
      if (loadVersion === boardLoadVersion && requestedToken === tokenInput.value.trim()) {
        render(data.features, data.reviewEnabled);
      }
    })
      .catch(function (err) {
        var failureVersion = err.boardVersion === undefined ? loadVersion : err.boardVersion;
        if (failureVersion !== boardLoadVersion || requestedToken !== tokenInput.value.trim()) return;
        status.textContent = err.message === 'unauthorized'
          ? 'That token was rejected.'
          : 'Could not load the board: ' + err.message;
      });
  }

  document.getElementById('load').addEventListener('click', load);
  tokenInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
})();
</script>
</body>
</html>
