<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board moderation · Cantinarr</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0805">
<link rel="icon" href="/static/favicon.png?v=3" type="image/png">
<link rel="stylesheet" href="/site.css?v=mobile-nav-1">
<style>
.mod-wrap { max-width: 860px; margin: 0 auto; padding: 60px 24px 90px; }
.mod-wrap h1 { font-family: var(--display); font-weight: 620; font-size: 2rem; margin-bottom: 8px; }
.mod-wrap .sub { color: var(--muted); margin-bottom: 28px; }
.unlock { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
.unlock input {
  flex: 1;
  min-width: 220px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: .95rem;
  padding: 11px 13px;
}
.unlock .btn { border: 0; cursor: pointer; font-family: var(--body); }
#mod-status { color: var(--muted); margin-bottom: 18px; }
#mod-status:empty { display: none; }
.mod-sections { display: grid; gap: 34px; }
.mod-group { padding: 0; }
.mod-group-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; padding-bottom: 8px; }
.mod-group-head h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.mod-group-count { color: var(--gold); font-family: var(--mono); font-size: .88rem; }
.mod-empty { color: var(--muted); }
.mod-list { list-style: none; display: grid; gap: 12px; padding: 0; }
.mod-item { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; }
.mod-item h3 { font-family: var(--display); font-weight: 600; font-size: 1.1rem; display: inline; overflow-wrap: anywhere; }
.mod-item .meta { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); margin-left: 10px; }
.mod-item .meta.pending { color: var(--signal); }
.mod-item .detail { color: var(--muted); font-size: .92rem; margin-top: 8px; white-space: pre-line; overflow-wrap: anywhere; }
.mod-item .review { color: var(--ink); font-size: .88rem; margin-top: 10px; white-space: pre-line; overflow-wrap: anywhere; }
.mod-item .review strong { color: var(--gold); }
.mod-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.mod-actions button {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--ink);
  font-size: .85rem;
  padding: 7px 12px;
  cursor: pointer;
}
.mod-actions button:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--border)); }
.mod-actions button.danger { color: var(--signal); }
.shipped-group { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; }
.shipped-group summary { display: flex; align-items: center; gap: 18px; cursor: pointer; list-style: none; }
.shipped-group summary::-webkit-details-marker { display: none; }
.shipped-group summary::marker { content: ''; }
.shipped-count { color: var(--gold); font-family: var(--display); font-size: clamp(2.4rem, 7vw, 3.2rem); line-height: 1; font-weight: 620; }
.shipped-summary-copy { display: grid; line-height: 1.35; }
.shipped-summary-copy strong { font-family: var(--display); font-size: 1.35rem; font-weight: 600; }
.shipped-summary-copy span { color: var(--muted); font-size: .9rem; }
.shipped-summary-copy .hide-copy, .shipped-group[open] .show-copy { display: none; }
.shipped-group[open] .hide-copy { display: inline; }
.shipped-group .mod-list { margin-top: 20px; }
@media (max-width: 600px) {
  .mod-wrap { padding: 36px 18px 70px; }
  .mod-item { padding: 16px; }
  .mod-item .meta { display: block; margin-left: 0; margin-top: 4px; }
}
</style>
</head>
<body>
<main class="mod-wrap">
  <h1>Board moderation</h1>
  <p class="sub">GPT-6 Luna reviews new ideas automatically. Handle uncertain ideas and manage the <a href="/roadmap/">roadmap</a> here. Requires the admin token.</p>
  <div class="unlock">
    <input id="token" type="password" placeholder="Admin token" autocomplete="current-password">
    <button id="load" class="btn btn-gold" type="button">Load board</button>
  </div>
  <p id="mod-status" role="status"></p>
  <div id="mod-sections" class="mod-sections"></div>
</main>

<script>
(function () {
  'use strict';

  var tokenInput = document.getElementById('token');
  var status = document.getElementById('mod-status');
  var sections = document.getElementById('mod-sections');
  var shippedOpen = false;
  tokenInput.value = sessionStorage.getItem('cb_admin') || '';

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      authorization: 'Bearer ' + tokenInput.value.trim(),
      'content-type': 'application/json'
    }, options.headers || {});
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) throw new Error(body.error || ('http_' + res.status));
        return body;
      });
    });
  }

  function act(id, action) {
    return api('/api/board/admin', { method: 'POST', body: JSON.stringify({ id: id, action: action }) })
      .then(load)
      .catch(function (err) { status.textContent = 'Action failed: ' + err.message; });
  }

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function actionButton(label, id, action, danger) {
    var btn = make('button', danger ? 'danger' : null, label);
    btn.type = 'button';
    if (danger) {
      btn.addEventListener('click', function () {
        if (btn.dataset.armed === '1') { act(id, action); return; }
        btn.dataset.armed = '1';
        btn.textContent = 'Confirm ' + label.toLowerCase();
        setTimeout(function () { btn.dataset.armed = ''; btn.textContent = label; }, 4000);
      });
    } else {
      btn.addEventListener('click', function () { act(id, action); });
    }
    return btn;
  }

  function renderItem(f, reviewEnabled) {
    var item = make('li', 'mod-item');
    var head = make('div');
    head.appendChild(make('h3', null, f.title));
    head.appendChild(make('span', 'meta' + (f.status === 'pending' ? ' pending' : ''),
      f.status + ' · ' + f.votes + (f.votes === 1 ? ' vote' : ' votes')));
    item.appendChild(head);
    if (f.detail) item.appendChild(make('p', 'detail', f.detail));
    var recommendation = f.review ? {
      approve: 'Approved', decline: 'Declined',
      human: f.status === 'pending' ? 'Needs your review' : 'Suggested human review'
    }[f.review.recommendation] : null;
    if (f.status === 'pending' || f.review) {
      var review = make('p', 'review');
      review.appendChild(make('strong', null, recommendation ? 'Luna: ' + recommendation :
        (!reviewEnabled ? 'Luna review is not configured' :
          (f.reviewState === 'waiting' ? 'Luna review will retry' : 'Awaiting Luna review'))));
      if (f.review) review.appendChild(document.createTextNode(' · ' + f.review.reason));
      item.appendChild(review);
    }
    var actions = make('div', 'mod-actions');
    if (f.status === 'pending') actions.appendChild(actionButton('Approve', f.id, 'approve'));
    if (f.status !== 'open' && f.status !== 'pending') actions.appendChild(actionButton('Reopen', f.id, 'open'));
    if (f.status !== 'planned') actions.appendChild(actionButton('Planned', f.id, 'planned'));
    if (f.status !== 'shipped') actions.appendChild(actionButton('Shipped', f.id, 'shipped'));
    if (f.status !== 'declined') actions.appendChild(actionButton('Decline', f.id, 'decline', true));
    actions.appendChild(actionButton('Delete', f.id, 'delete', true));
    item.appendChild(actions);
    return item;
  }

  function render(features, reviewEnabled) {
    sections.textContent = '';
    var groups = { pending: [], planned: [], open: [], declined: [], shipped: [] };
    features.forEach(function (f) {
      if (groups[f.status]) groups[f.status].push(f);
    });
    function newest(a, b) { return b.createdAt.localeCompare(a.createdAt) || b.id - a.id; }
    function oldest(a, b) { return a.createdAt.localeCompare(b.createdAt) || a.id - b.id; }
    function mostVotes(a, b) { return b.votes - a.votes || newest(a, b); }
    groups.pending.sort(oldest);
    groups.planned.sort(mostVotes);
    groups.open.sort(mostVotes);
    groups.declined.sort(newest);
    groups.shipped.sort(newest);

    function addGroup(label, items, always) {
      if (!items.length && !always) return;
      var group = make('section', 'mod-group');
      var head = make('div', 'mod-group-head');
      head.appendChild(make('h2', null, label));
      head.appendChild(make('span', 'mod-group-count', String(items.length)));
      group.appendChild(head);
      if (items.length) {
        var list = make('ul', 'mod-list');
        items.forEach(function (f) { list.appendChild(renderItem(f, reviewEnabled)); });
        group.appendChild(list);
      } else {
        group.appendChild(make('p', 'mod-empty', 'No ideas need a decision.'));
      }
      sections.appendChild(group);
    }

    addGroup('Pending review', groups.pending, true);
    addGroup('Planned', groups.planned);
    addGroup('Open', groups.open);
    addGroup('Declined', groups.declined);

    var shipped = make('details', 'shipped-group');
    shipped.open = shippedOpen;
    shipped.addEventListener('toggle', function () { shippedOpen = shipped.open; });
    var summary = make('summary');
    summary.appendChild(make('strong', 'shipped-count', String(groups.shipped.length)));
    var summaryCopy = make('span', 'shipped-summary-copy');
    summaryCopy.appendChild(make('strong', null, 'Shipped'));
    summaryCopy.appendChild(make('span', 'show-copy', 'Show shipped ideas'));
    summaryCopy.appendChild(make('span', 'hide-copy', 'Hide shipped ideas'));
    summary.appendChild(summaryCopy);
    shipped.appendChild(summary);
    var shippedList = make('ul', 'mod-list');
    groups.shipped.forEach(function (f) { shippedList.appendChild(renderItem(f, reviewEnabled)); });
    shipped.appendChild(shippedList);
    sections.appendChild(shipped);
    status.textContent = features.length === 0 ? 'Nothing on the board yet.' : '';
  }

  function load() {
    if (!tokenInput.value.trim()) { status.textContent = 'Enter the admin token first.'; return; }
    sessionStorage.setItem('cb_admin', tokenInput.value.trim());
    status.textContent = 'Loading…';
    api('/api/board/admin').then(function (data) { render(data.features, data.reviewEnabled); })
      .catch(function (err) {
        status.textContent = err.message === 'unauthorized'
          ? 'That token was rejected.'
          : 'Could not load the board: ' + err.message;
      });
  }

  document.getElementById('load').addEventListener('click', load);
  tokenInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
})();
</script>
</body>
</html>
